<style>

section{border:0}

main{max-width:520px;margin:auto;padding:14px 14px 100px;display:grid;gap:14px}

.wc{padding:10px 0;border-bottom:1px dashed var(--bd)}.wc .row{justify-content:space-between}

.ch.p{--c:var(--pri)}.ch.s{--c:var(--sl)}.ch.g{--c:var(--gold)}.ch.a{--c:var(--acc)}

.ic{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic .f{fill:currentColor;fill-opacity:.22;stroke:none}
button{display:inline-flex;gap:8px;align-items:center;justify-content:center}
nav button{display:grid}nav button span{display:grid;place-items:center}nav .ic{width:23px;height:23px}

.jarbox svg{width:170px}
.stage{font:800 1.35rem/1.2 var(--fd);margin:4px 0 6px}
.tr{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--bd)}.tr>.ic{color:var(--pri);width:22px;height:22px}

.pills button.alt{background:var(--bd)}

.sgm{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:999px}.sgm button{flex:1;background:none;color:var(--mut);border-radius:999px;padding:8px 4px}.sgm button.on{background:var(--pri);color:var(--on)}

.idv{--pri:#c084fc;--acc:#c084fc;--grad:linear-gradient(90deg,#a78bfa,#c084fc)}
</style></head>

 const me=face().replace('<svg viewBox="0 0 140 160" aria-hidden="true">',`<svg x="${(c.x-23).toFixed(1)}" y="${(c.y-50).toFixed(1)}" width="46" height="52" viewBox="0 0 140 160" overflow="visible" aria-hidden="true">`);
 return `<section><svg viewBox="0 0 320 120" class="chart" role="img" aria-label="Ma frise vers la moi du futur"><path d="${path(0,1,48)}" fill="none" stroke="var(--bd)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 9"/><path d="${path(0,p||.001,24)}" fill="none" stroke="var(--pri)" stroke-width="4" stroke-linecap="round"/>${ms}
<g transform="translate(${e.x.toFixed(1)} ${e.y.toFixed(1)})"><circle cy="-22" r="22" fill="var(--gold)" opacity=".15"/><g fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="3 3"><circle cy="-31" r="7"/><rect x="-9" y="-23" width="18" height="24" rx="8"/></g><text y="16" text-anchor="middle" font-size="9" fill="var(--gold)" font-weight="700">Moi du futur</text></g>${me}</svg>
<div class="row" style="justify-content:space-between;align-items:baseline"><div class="stage" style="margin:0">${idStage()}</div><b>${Math.round(p*100)} %</b></div><p class="mut" style="margin:6px 0 0">${say()}</p></section>`}
function vDay(){const n=inWeek(cw()).length,ln=lastSleep();
 const st4=[["seance",n+"/4","séances"],["read",rdToday()+"/"+st.rd,"pages"],["stretch",strWeek()+"/"+st.sgoal,"étirements"],["sleep",ln?fmtH(ln.h):"–","sommeil"]].map(x=>`<div onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></div>`).join("");
 return frise()+`<section><div class="ch p">Mes résultats</div><div class="strip" style="margin:0">${st4}</div></section>`+vProg()}
function vRead(){const ds=[];for(let i=6;i>=0;i--)ds.push(dstr(i));const v=ds.map(d=>st.rl[d]||0),lb=ds.map(d=>"DLMMJVS"[new Date(d+"T00:00:00").getDay()]);
 const cur=st.books.filter(b=>!b.done),fin=st.books.filter(b=>b.done);
 const opts=cur.map(b=>`<option value="${b.id}" ${st.rb==b.id?"selected":""}>${esc(b.t)}</option>`).join("");
 const card=b=>{const n=b.ideas.length,pc=Math.min(100,b.read/b.pages*100),got=b.ideas.filter((_,i)=>b.read>=Math.ceil((i+1)/n*b.pages)).length;
  const steps=b.ideas.map((t,i)=>{const u=Math.ceil((i+1)/n*b.pages),on=b.read>=u;return `<div class="step ${on?"on":""}"><div class="dotc">${on?"✓":ic("lock")}</div><div>${on?esc(t):`<span class="mut">Se débloque à la page ${u}</span>`}</div></div>`}).join("");
  return `<section><div class="ch a">${esc(b.t)}</div>${b.a?`<p class="mut" style="margin:0 0 8px">${esc(b.a)}</p>`:""}<div class="row" style="justify-content:space-between"><b>${b.read} / ${b.pages} pages</b><span class="mut">${n?got+" / "+n+" idées apprises":""}</span></div><div class="bar" style="margin:8px 0 12px"><i style="width:${pc}%"></i></div>${b.g?`<p style="margin:0 0 12px"><b>Ce que ça va t’apporter</b><br><span class="mut">${esc(b.g)}</span></p>`:""}${n?`<div class="mut" style="margin-bottom:8px">Ce que j’apprends</div>${steps}`:`<p class="mut">Ajoute les idées clés du livre pour voir ce que tu apprends au fil des pages.</p>`}<details><summary class="mut">Idées clés du livre</summary><textarea id="ti${b.id}" rows="5" placeholder="Une idée par ligne">${esc(b.ideas.join("\n"))}</textarea><p><button class="alt" onclick="setIdeas(${b.id})">Enregistrer</button> <button class="alt" onclick="delBook(${b.id})">Supprimer</button></p></details></section>`};
 return `<section><div class="ch a">Lecture du jour</div><div class="grid2" style="align-items:center">${ring(rdToday()/st.rd*100,rdToday()+"","sur "+st.rd+" pages","var(--acc)")}<div><div class="kpi">${rdStreak()} j</div><p class="mut">de suite à l’objectif<br>${totPages()} pages au total</p></div></div>
${cur.length?`<div class="row" style="margin-top:12px"><select id="rbk" onchange="st.rb=this.value;save()">${opts}</select><input id="rpg" type="number" min="1" placeholder="Pages lues" style="max-width:110px"><button onclick="addPages()">Ajouter</button></div>`:`<p class="mut">Ajoute un livre pour commencer.</p>`}</section>
<section><div class="ch s">7 derniers jours</div>${bars(v,Math.max(st.rd*1.6,...v),st.rd,lb,"var(--acc)")}<p class="mut">Ligne pointillée : ton objectif de ${st.rd} pages</p></section>
${cur.map(card).join("")}
<section><div class="ch g">Ajouter un livre</div><div class="row"><input id="bt" placeholder="Titre"><input id="bp" type="number" min="1" placeholder="Pages" style="max-width:90px"></div><textarea id="bi" rows="4" placeholder="Idées clés (optionnel), une par ligne"></textarea><p class="mut">Astuce : donne le titre à Claude, il te prépare la liste d’idées clés à coller ici.</p><button onclick="addBook()" style="width:100%">Ajouter ce livre</button></section>
${fin.length?`<section><div class="ch g">Mon étagère</div>${fin.map(b=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${esc(b.t)}</span><b>${b.pages} p.</b></div>`).join("")}</section>`:""}`}
function addBook(){const t=document.getElementById("bt").value.trim(),p=+document.getElementById("bp").value;if(!t||!(p>0))return;const ideas=document.getElementById("bi").value.split("\n").map(x=>x.trim()).filter(Boolean);st.books.push({id:Date.now(),t,pages:p,read:0,ideas,done:""});save();render()}
function setIdeas(id){const b=st.books.find(x=>x.id===id);b.ideas=document.getElementById("ti"+id).value.split("\n").map(x=>x.trim()).filter(Boolean);save();render()}
function delBook(id){if(confirm("Supprimer ce livre ?")){st.books=st.books.filter(x=>x.id!==id);save();render()}}
function addPages(){const id=+document.getElementById("rbk").value,n=Math.floor(+document.getElementById("rpg").value),b=st.books.find(x=>x.id===id);if(!b||!(n>0))return;const a=Math.min(n,b.pages-b.read);if(a<=0)return;b.read+=a;st.rl[today()]=(st.rl[today()]||0)+a;if(b.read>=b.pages)b.done=today();save();render()}
function vStretch(){const L=VID||[],zs=["Tous","Front split","Middle split"],z=zs.includes(st.sz)?st.sz:"Tous",list=L.filter(v=>z==="Tous"||v.zone===z),sw=strWeek();
 const chips=zs.map(k=>`<button class="${k===z?"in":""}" onclick="st.sz='${k}';save();render()">${k}</button>`).join("");
 const dT=id=>st.sx.some(x=>x.d===today()&&x.id===id);
 const cards=list.map(v=>{const pl=st.pv===v.id;return `<div class="vc"><div class="row" style="justify-content:space-between"><div><b>${esc(v.titre)}</b><div class="mut">${esc(v.zone||"")}${v.duree?" · "+esc(v.duree):""}</div></div>${pl?"":`<button onclick="st.pv='${esc(v.id)}';render()">Lancer</button>`}</div>${pl?`${v.yt?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(ytid(v.yt))}?playsinline=1&rel=0&autoplay=1" title="${esc(v.titre)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:0;border-radius:14px;margin:10px 0"></iframe>`:`<video src="${esc(v.fichier)}" controls autoplay playsinline style="margin:10px 0" onerror="this.outerHTML='<p class=mut>Vidéo introuvable : vérifie le nom du fichier.</p>'"></video>`}<button ${dT(v.id)?"disabled":""} onclick="doneStr('${esc(v.id)}')">${dT(v.id)?"Fait aujourd’hui":"J’ai fait cet étirement"}</button>`:""}</div>`}).join("");
 return `<section><div class="ch g">Cette semaine</div><div class="grid2" style="align-items:center">${ring(sw/st.sgoal*100,sw+"/"+st.sgoal,"jours","var(--gold)")}<div><div class="kpi">${st.sx.length}</div><p class="mut">étirements faits<br>objectif : ${st.sgoal} jours par semaine</p></div></div></section>
<section><div class="ch g">Mes vidéos</div><div class="pills">${chips}</div>${cards||`<p class="mut">${VID===null?"Chargement…":"Aucune vidéo pour l’instant. Ajoute-les avec le mode d’emploi ci-dessous."}</p>`}</section>
<section><details><summary class="mut">Comment ajouter mes vidéos ?</summary><p class="mut">Pour chaque vidéo, ajoute une ligne dans <b>etirements.json</b> avec : id, titre, zone (Front split ou Middle split), duree et <b>yt</b> (le lien YouTube non répertorié de la vidéo). Pour une petite vidéo hébergée sur ton site, utilise <b>fichier</b> à la place de yt.</p></details></section>`}
const ytid=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:String(u)};
function doneStr(id){st.sx.push({d:today(),id});save();render()}
function vBody(){const k=st.sub||"seance",f={seance:vSeance,stretch:vStretch,sleep:vSleep}[k]||vSeance;return `<div class="sgm">${[["seance","Séance"],["stretch","Étirements"],["sleep","Sommeil"]].map(t=>`<button class="${k===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</div>`+f()}
function muscu(){const L=st.me||[];
 const pills=L.map((e,i)=>{const inn=st.plan.some(x=>x.z==="Muscu"&&x.e===e);return `<button class="${inn?"in":""}" onclick="addM(${i})">${inn?"✓ ":"+ "}${esc(e)}</button>`}).join("");
 const gest=L.length?`<details><summary class="mut">Gérer ma liste</summary>${L.map((e,i)=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span>${esc(e)}</span><button class="alt" onclick="delM(${i})" aria-label="Retirer de ma liste">✕</button></div>`).join("")}</details>`:"";
 return `${pills?`<div class="pills">${pills}</div>`:`<p class="mut" style="margin-top:0">Ta liste de muscu est vide : ajoute tes exercices ci-dessous.</p>`}<div class="row"><input id="nm" placeholder="Ajouter un exercice de muscu"><button class="alt" onclick="newM()">Ajouter</button></div>${gest}`}
function newM(e){e=(e||document.getElementById("nm").value).trim();if(!e)return;st.me=st.me||[];if(!st.me.includes(e))st.me=st.me.concat([e]);if(!st.plan.some(x=>x.z==="Muscu"&&x.e===e))st.plan.push({z:"Muscu",e,d:false});save();render()}
function addM(i){const e=st.me[i],j=st.plan.findIndex(x=>x.z==="Muscu"&&x.e===e);if(j>=0)st.plan.splice(j,1);else st.plan.push({z:"Muscu",e,d:false});save();render()}
function delM(i){const e=st.me[i];st.me=st.me.filter((_,j)=>j!==i);st.plan=st.plan.filter(x=>!(x.z==="Muscu"&&x.e===e));save();render()}
function delK(i){const z=st.z,e=lst(z)[i];st.ze[z]=(st.ze[z]||[]).filter(x=>x!==e);st.plan=st.plan.filter(x=>!(x.z===z&&x.e===e));save();render()}
function render(){if(NAV==="dom"&&["seance","stretch","sleep"].includes(st.tab)){st.sub=st.tab;st.tab="body"}
 const T=NAVS[NAV],v={day:vDay,seance:vSeance,read:vRead,stretch:vStretch,sleep:vSleep,prog:vDay,set:vSet,body:vBody}[st.tab]||vDay,back=NAV==="five"&&st.tab==="sleep"?`<p><button class="alt" onclick="go('day')">← Retour</button></p>`:"";
 document.getElementById("app").innerHTML=`<header><b>Future moi</b><button class="alt" onclick="go('set')" aria-label="Réglages">${ic("gear")}</button></header>`+back+v();
 const nv=document.getElementById("nav");nv.className="n"+T.length;nv.innerHTML=T.map(t=>`<button class="${st.tab===t[0]?"on":""}" onclick="go('${t[0]}')"><span>${ic(t[1])}</span>${t[2]}</button>`).join("")}

function vPig(){const pot=48*st.per,p=pot?Math.min(100,earned()/pot*100):0;
 const b=st.bought.map(x=>typeof x==="string"?{n:x}:x).map(x=>`<div class="gift"><b>${ic("gift")}</b>${esc(x.n)}${x.p?"<br>"+x.p+" €":""}</div>`).join("")||`<p class="mut">Ton premier cadeau t’attend.</p>`;
 return `<section><div class="ch g">Ma tirelire</div><div class="jarbox">${jar(p)}<div><div class="big">${bal()} €</div><p class="mut">${earned()} € gagnés sur ${pot} € possibles<br>${st.per} € par séance</p></div></div></section>
<section><div class="ch g">Mon étagère de cadeaux</div><div class="shelf">${b}</div></section>`}
function vWish(){const w=st.wish.map(x=>{const fv=st.fav.includes(x.id),r=Math.min(100,Math.max(0,bal()/x.p*100)),ok=bal()>=x.p;return `<div class="wc"><div class="row" style="justify-content:space-between"><span>${esc(x.n)} <b>${x.p} €</b></span><div class="row"><button class="${fv?"":"alt"}" onclick="fav(${x.id})" aria-label="Envie de la semaine">${ic("star")}</button><button ${ok?"":"disabled"} onclick="buyId(${x.id})">${ok?ic("gift")+" Me l’offrir":"Il manque "+Math.ceil(x.p-bal())+" €"}</button><button class="alt" onclick="delW(${x.id})" aria-label="Supprimer">✕</button></div></div><div class="bar" style="margin-top:6px"><i style="width:${r}%"></i></div></div>`}).join("")||`<p class="mut">Ajoute ce qui te ferait plaisir : livre, maquillage, trouvaille Vinted…</p>`;
 return `<section><div class="ch g">Mes envies</div><p class="mut" style="margin-top:0">Appuie sur l’étoile pour choisir jusqu’à 3 envies de la semaine. Elles s’affichent sur ta page Séance.</p>${w}</section>
<section><div class="ch g">Ajouter une envie</div><div class="row"><input id="wn" placeholder="Envie (ex. un livre)"><input id="wp" type="number" min="1" placeholder="Prix €" style="max-width:90px"><button onclick="addW()">Ajouter</button></div></section>`}
function fav(id){if(st.fav.includes(id))st.fav=st.fav.filter(x=>x!==id);else{if(st.fav.length>=3)st.fav=st.fav.slice(1);st.fav=st.fav.concat([id])}save();render()}
function buyId(id){const i=st.wish.findIndex(x=>x.id===id);if(i<0)return;const x=st.wish[i];if(bal()<x.p)return;st.spent+=x.p;st.bought.push({n:x.n,p:x.p});st.wish.splice(i,1);st.fav=st.fav.filter(f=>f!==id);save();render()}
function delW(id){st.wish=st.wish.filter(x=>x.id!==id);st.fav=st.fav.filter(f=>f!==id);save();render()}
function gains(){const w=cw(),sess=inWeek(w).filter(x=>!x.j).length,got=sess*st.per,left=Math.max(0,4-inWeek(w).length)*st.per,av=bal()+left;
 const cards=st.fav.map(id=>st.wish.find(x=>x.id===id)).filter(Boolean).map(x=>{const r=Math.min(100,Math.max(0,av/x.p*100)),ok=bal()>=x.p;return `<div class="wc"><div class="row" style="justify-content:space-between"><span>${esc(x.n)} <b>${x.p} €</b></span><span class="mut">${ok?"Déjà possible":av>=x.p?"À portée cette semaine":"Il manque "+Math.ceil(x.p-av)+" €"}</span></div><div class="bar" style="margin-top:6px"><i style="width:${r}%"></i></div></div>`}).join("");
 return `<section><div class="ch g">Mes gains de la semaine</div><div class="grid2" style="align-items:center"><div><div class="kpi">${got} €</div><p class="mut">gagnés cette semaine</p></div><div><div class="kpi">+${left} €</div><p class="mut">encore possibles</p></div></div>${cards||`<p class="mut">Choisis jusqu’à 3 envies de la semaine dans l’onglet Envies : elles s’afficheront ici.</p>`}</section>`}
function vSeance(){const k=st.ss||"seance",f={seance:vSeanceMain,cagnotte:vPig,envies:vWish}[k]||vSeanceMain;return `<div class="sgm">${[["seance","Séance"],["cagnotte","Cagnotte"],["envies","Envies"]].map(t=>`<button class="${k===t[0]?"on":""}" onclick="st.ss='${t[0]}';save();render()">${t[1]}</button>`).join("")}</div>`+(k==="seance"?gains():"")+f()}
function add(z,i){const e=lst(z)[i],j=st.plan.findIndex(x=>x.z===z&&x.e===e);if(j>=0)st.plan.splice(j,1);else st.plan.push({z,e,d:false});save();render()}
function addC(){const v=document.getElementById("ne").value.trim();if(!v)return;(st.ze[st.z]=st.ze[st.z]||[]).push(v);st.plan.push({z:st.z,e:v,d:false});save();render()}
function tg(i){st.plan[i].d=!st.plan[i].d;save();render()}
function rm(i){st.plan.splice(i,1);save();render()}
function done(){const e=st.plan.filter(x=>x.d).map(x=>({z:x.z,e:x.e}));if(!e.length)return;st.s.push({d:today(),e});st.plan=[];save();render()}
function joker(){st.s.push({d:today(),j:1});save();render()}
function buy(i){const x=st.wish[i];if(bal()<x.p)return;st.spent+=x.p;st.bought.push({n:x.n,p:x.p});st.wish.splice(i,1);save();render()}
function addW(){const n=document.getElementById("wn").value.trim(),p=+document.getElementById("wp").value;if(!n||!p)return;st.wish.push({id:Date.now()*1000+Math.floor(Math.random()*1000),n,p});save();render()}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
